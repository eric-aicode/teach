  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ===================================================================
       1. Design Tokens & Cyber Dark Theme
       =================================================================== */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display: 'Outfit', var(--font-sans);
      --font-mono: 'JetBrains Mono', monospace;
    }

    

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep) !important;
      background-image: var(--bg-gradient) !important;
      transition: background-color 0.3s ease, color 0.3s ease;
      user-select: none;
    }

    /* 頂部導覽列 */
    .lab-bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.35rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .lab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-heading);
      padding: 0.28rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .lab-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan-core);
      color: var(--cyan-core);
    }
    .lab-btn.active {
      background: var(--cyan-core);
      color: #04101e;
      border-color: var(--cyan-core);
      font-weight: 900;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
    }
    .lab-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan-core);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 800;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* 舞台主容器 - 1080p 零捲動，滿版大畫布 */
    .slide-stage {
      width: 100%;
      max-width: 1600px;
      height: calc(100vh - 46px);
      padding: 0.4rem 1.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      gap: 0.3rem;
    }

    /* 頂部標題區 */
    .header-box {
      text-align: center;
      flex-shrink: 0;
    }
    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--cyan-core);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.1rem;
    }
    .main-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 3.2vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      color: var(--text-pure);
      line-height: 1.15;
    }
    .subtitle {
      font-size: clamp(0.95rem, 1.2vw, 1.15rem);
      font-weight: 700;
      color: var(--text-dim);
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    .subtitle .highlight {
      color: #86efac;
      font-weight: 800;
    }

    /* ===================================================================
       核心工作區容器：滿版高對比畫布
       =================================================================== */
    .canvas-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 24px;
      padding: 0.4rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(14px);
    }

    .canvas-wrap svg {
      width: 100%;
      height: 100%;
      max-height: 750px;
      display: block;
    }

    /* 切割墊特寫視角內工具元素懸浮互動 */
    #svgMatView .interactive-tool {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
      transform-origin: center;
    }
    #svgMatView .interactive-tool:hover {
      transform: scale(1.035);
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.85));
    }
    #svgMatView .interactive-tool.stand-hot:hover {
      filter: drop-shadow(0 0 26px rgba(244, 63, 94, 0.9));
    }

    /* 全景與特寫可拖曳元素 (座位、切割墊、電烙鐵架、清潔鋼絲球) */
    .draggable-item {
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .draggable-item:hover {
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.85));
    }
    .draggable-item.stand-hot:hover {
      filter: drop-shadow(0 0 26px rgba(244, 63, 94, 0.95));
    }
    .draggable-item.is-dragging {
      cursor: grabbing !important;
      filter: drop-shadow(0 0 28px rgba(251, 191, 36, 0.95)) !important;
      opacity: 0.95;
    }

    /* 底部輔助提示條 */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 0.38rem 1.2rem;
      background: var(--bg-card) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px;
      font-size: 0.88rem;
      color: var(--text-heading) !important;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: var(--shadow-card);
    }
    .status-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.red { background: #f43f5e; box-shadow: 0 0 8px #f43f5e; }
    .status-dot.yellow { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .status-dot.green { background: #34d399; box-shadow: 0 0 8px #34d399; }
  </style>

      </div>
      <div class="status-item">
        <span class="status-dot yellow"></span>
        <span><strong>口訣 2：</strong>鋼絲球隨手清（保持烙鐵頭光亮）</span>
      </div>
      <div class="status-item">
        <span class="status-dot green"></span>
        <span><strong>口訣 3：</strong>A3 切割墊中央淨空（只在墊上焊接）</span>
      </div>
      <div class="status-item" style="color: var(--cyan-core); margin-left: 0.5rem;">
        <span>🖐️ <strong>提示：</strong>全景（座位、切割墊）與特寫（烙鐵架、鋼絲球）均可自由拖曳調整（按 R 重設）</span>
      </div>
    </div>

  </main>

  <script>
    // 深淺主題切換
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    // 視角切換器 (先全景，才 A3 特寫)
    function switchView(mode) {
      const svgMat = document.getElementById('svgMatView');
      const svgTable = document.getElementById('svgTableView');
      const btnMat = document.getElementById('viewBtnMat');
      const btnTable = document.getElementById('viewBtnTable');

      if (mode === 'table') {
        svgMat.style.display = 'none';
        svgTable.style.display = 'block';
        btnTable.classList.add('active');
        btnMat.classList.remove('active');
      } else {
        svgMat.style.display = 'block';
        svgTable.style.display = 'none';
        btnMat.classList.add('active');
        btnTable.classList.remove('active');
      }
    }

    // ===================================================================
    // 全景與特寫可拖曳自訂佈局功能 (Draggable Workbench & Tools Items)
    // ===================================================================
    const svgTable = document.getElementById('svgTableView');
    const dragItems = document.querySelectorAll('.draggable-item');

    let activeDrag = null;
    let activeDragSvg = null;
    let startPointer = { x: 0, y: 0 };
    let startTranslate = { x: 0, y: 0 };

    function getSVGPoint(svg, evt) {
      if (!svg) return { x: 0, y: 0 };
      const pt = svg.createSVGPoint();
      if (evt.touches && evt.touches.length > 0) {
        pt.x = evt.touches[0].clientX;
        pt.y = evt.touches[0].clientY;
      } else {
        pt.x = evt.clientX;
        pt.y = evt.clientY;
      }
      const ctm = svg.getScreenCTM();
      return ctm ? pt.matrixTransform(ctm.inverse()) : { x: pt.x, y: pt.y };
    }

    function parseTranslate(transformStr) {
      if (!transformStr) return { x: 0, y: 0 };
      const match = /translate\(\s*([-\d.]+)[,\s]+([-\d.]+)\s*\)/.exec(transformStr);
      if (match) {
        return { x: parseFloat(match[1]), y: parseFloat(match[2]) };
      }
      return { x: 0, y: 0 };
    }

    // 載入持久化自訂位置
    const savedPositions = JSON.parse(localStorage.getItem('slide07_workbench_positions') || '{}');
    dragItems.forEach(item => {
      const id = item.id;
      if (id && savedPositions[id]) {
        item.setAttribute('transform', `translate(${savedPositions[id].x}, ${savedPositions[id].y})`);
      }

      function onStart(e) {
        if (e.type === 'mousedown' && e.button !== 0) return;
        activeDrag = item;
        activeDragSvg = item.ownerSVGElement || svgTable;
        // 將拖曳中物件移至最上層
        activeDrag.parentNode.appendChild(activeDrag);
        document.body.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
        const svgPt = getSVGPoint(activeDragSvg, e);
        startPointer = { x: svgPt.x, y: svgPt.y };
        startTranslate = parseTranslate(item.getAttribute('transform'));
        item.classList.add('is-dragging');
        e.preventDefault();
      }

      item.addEventListener('mousedown', onStart);
      item.addEventListener('touchstart', onStart, { passive: false });
    });

    window.addEventListener('mousemove', (e) => {
      if (!activeDrag || !activeDragSvg) return;
      const svgPt = getSVGPoint(activeDragSvg, e);
      const dx = svgPt.x - startPointer.x;
      const dy = svgPt.y - startPointer.y;
      const nx = Math.round(startTranslate.x + dx);
      const ny = Math.round(startTranslate.y + dy);
      activeDrag.setAttribute('transform', `translate(${nx}, ${ny})`);
    });

    window.addEventListener('touchmove', (e) => {
      if (!activeDrag || !activeDragSvg) return;
      const svgPt = getSVGPoint(activeDragSvg, e);
      const dx = svgPt.x - startPointer.x;
      const dy = svgPt.y - startPointer.y;
      const nx = Math.round(startTranslate.x + dx);
      const ny = Math.round(startTranslate.y + dy);
      activeDrag.setAttribute('transform', `translate(${nx}, ${ny})`);
      e.preventDefault();
    }, { passive: false });

    function onEnd() {
      if (!activeDrag) return;
      activeDrag.classList.remove('is-dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      // 儲存當前位置至 localStorage
      const positions = JSON.parse(localStorage.getItem('slide07_workbench_positions') || '{}');
      positions[activeDrag.id] = parseTranslate(activeDrag.getAttribute('transform'));
      localStorage.setItem('slide07_workbench_positions', JSON.stringify(positions));
      activeDrag = null;
      activeDragSvg = null;
    }

    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);

    // 重設位置至預設 (支援全景與特寫兩大視角)
    function resetWorkbenchPositions() {
      localStorage.removeItem('slide07_workbench_positions');
      const defaults = {
        'drag-seat-a': { x: 0, y: 0 },
        'drag-seat-b': { x: 0, y: 0 },
        'panorama-mat-left': { x: 370, y: 125 },
        'panorama-mat-right': { x: 940, y: 125 },
        'hero-stand-group': { x: -130, y: 40 },
        'hero-cleanball-group': { x: -140, y: 12 },
        'hero-socket-group': { x: 1020, y: 150 }
      };
      Object.keys(defaults).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.setAttribute('transform', `translate(${defaults[id].x}, ${defaults[id].y})`);
        }
      });
    }

    // 鍵盤導覽 (流暢逐步演練：全景 -> A3 特寫 -> 下一頁)
    window.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') {
        toggleTheme();
      } else if (e.key === 'v' || e.key === 'V') {
        // V 鍵自由切換
        const isTable = document.getElementById('svgTableView').style.display !== 'none';
        switchView(isTable ? 'mat' : 'table');
      } else if (e.key === 'r' || e.key === 'R') {
        // R 鍵重設位置
        resetWorkbenchPositions();
      } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        const isTable = document.getElementById('svgTableView').style.display !== 'none';
        if (isTable) {
          switchView('mat');
        } else {
          window.location.href = 'slide08_safety_rules.html';
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        const isMat = document.getElementById('svgMatView').style.display !== 'none';
        if (isMat) {
          switchView('table');
        } else {
          window.location.href = 'slide06_sentence_frame.html';
        }
      }
    });
  </script>

  

  <!-- 4 大主題切換與播放器父子通訊橋接 -->
  <script>
    (function() {
      const THEMES = ['cyber', 'clean', 'maker', 'titanium'];
      function applyTheme(theme) {
        if (!theme) theme = 'cyber';
        document.documentElement.setAttribute('data-theme', theme);
      }
      try {
        const savedTheme = localStorage.getItem('slides_theme') || 'cyber';
        applyTheme(savedTheme);
      } catch(e) {}

      function cycleLocalTheme() {
        const curr = document.documentElement.getAttribute('data-theme') || 'cyber';
        let idx = THEMES.indexOf(curr);
        if (idx === -1) idx = 0;
        const next = THEMES[(idx + 1) % THEMES.length];
        applyTheme(next);
        try { localStorage.setItem('slides_theme', next); } catch(e) {}
      }

      window.addEventListener('keydown', function(e) {
        if (window.parent && window.parent !== window) {
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'next' }, '*');
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'prev' }, '*');
          } else if (e.key === 't' || e.key === 'T') {
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'theme' }, '*');
          }
        } else {
          // 獨立開啟時按 T 也能切換 4 種風格
          if (e.key === 't' || e.key === 'T') {
            cycleLocalTheme();
          }
        }
      });
    })();
  </script>
