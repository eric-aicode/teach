    .lab-btn:hover {

    .mat-hero-card#card-conductor.selected::before {

      background: rgba(245, 158, 11, 0.2);
      border-color: var(--amber-gold);
    }

    .mat-hero-card#card-insulator.selected {

    .mat-hero-card#card-insulator.selected::before {
      color: var(--coral-rose);
      background: rgba(251, 113, 133, 0.2);
      border-color: var(--coral-rose);

    .mat-hero-card.selected::before {
      content: '● 測試中';
      position: absolute;
      right: 14px;
      top: 10px;
      font-size: 0.78rem;
      font-weight: 900;
      padding: 0.18rem 0.65rem;
      border-radius: 9999px;
      border: 1px solid currentColor;
    }

    /* 超大 SVG 向量圖框 (高達 150px！) */

      width: 100%;
      height: 150px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.28);
      border: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;

    [data-theme="light"] .mat-svg-frame {
      background: rgba(241, 245, 249, 0.85);
      border-color: rgba(0, 0, 0, 0.08);
    }

    .mat-vector-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));

    .mat-text-group {

      flex-direction: column;
      align-items: center;
      gap: 0.2rem;

      font-size: clamp(2rem, 2.7vw, 2.5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* 材料中文標示 */
    .mat-word-zh {
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--text-body);
    }

    /* ==========================================================================
       右側 2/3：大型電路測試台
       ========================================================================== */
    .circuit-stage-panel {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 24px;
      padding: 1.25rem 1.75rem 1.4rem 1.75rem;

      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;

    .stage-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 0.5rem;
    }

    .stage-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-heading);
    }

    .quick-selector {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .quick-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-body);
      font-size: 0.88rem;
      font-weight: 800;
      padding: 0.28rem 0.85rem;
      border-radius: 9999px;

      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;

    .quick-btn:hover {

      background: rgba(255, 255, 255, 0.12);
    }

    .quick-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan-core);
      color: var(--cyan-core);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* 大比例 SVG 電路畫布 (viewBox 0 0 800 340，大幅加高版) */
    .bench-svg {
      width: 100%;
      height: 340px;
      overflow: visible;
      display: block;
    }

    /* 插槽懸停吸附提示 */
    .slot-rect-guide {
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .slot-rect-guide:hover,
    .slot-active-hover {
      stroke: var(--cyan-core) !important;
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    /* 超大燈泡發光光暈 (多重暖金強光) */
    .bulb-glow-lit {
      fill: #facc15;
      filter: drop-shadow(0 0 30px #f59e0b) drop-shadow(0 0 70px #fbbf24) drop-shadow(0 0 110px rgba(254, 240, 138, 0.85));
      animation: pulseBulb 1.5s infinite alternate ease-in-out;
    }

    .bulb-glow-off {
      fill: #1e293b;
      opacity: 0.6;
    }

    @keyframes pulseBulb {
      0% {
        filter: drop-shadow(0 0 25px #f59e0b) drop-shadow(0 0 60px #fbbf24);
      }

      100% {
        filter: drop-shadow(0 0 45px #fbbf24) drop-shadow(0 0 95px #fde047) drop-shadow(0 0 130px rgba(253, 224, 71, 0.6));
      }
    }

    /* 電子流動循環動畫 */
    .electron-flow-active {
      stroke-dasharray: 14 16;
      animation: electronLoopAnim 1s linear infinite;
    }

    @keyframes electronLoopAnim {
      from {
        stroke-dashoffset: 90;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    /* 自訂 100% 實體不透明拖曳跟隨元件 (呈現完整大圖示，無半透明、無殘影) */
    .solid-drag-avatar {
      position: fixed;
      z-index: 999999;
      pointer-events: none;
      opacity: 1 !important;
      border-radius: 20px;
      background: var(--bg-card);
      border: 3px solid var(--border-glow);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px var(--cyan-core);
      padding: 10px 14px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 240px;
      transform: translate(-50%, -50%) scale(1.05);
      transition: transform 0.05s ease-out;
      user-select: none;
    }

    .solid-drag-avatar .avatar-svg-box {
      width: 100%;
      height: 116px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .solid-drag-avatar .avatar-svg-box svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    /* 底部測試結果評估欄 */
    .stage-bottom-eval {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.65rem;
      margin-top: 0.4rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .eval-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      padding: 0.55rem 1.55rem;
      border-radius: 9999px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .eval-badge.pass {
      background: rgba(16, 185, 129, 0.22);
      border: 2.5px solid var(--emerald-mint);
      color: #34d399;
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.45);
    }

    .eval-badge.stop {
      background: rgba(244, 63, 94, 0.22);
      border: 2.5px solid var(--coral-rose);
      color: #fb7185;
      box-shadow: 0 0 25px rgba(251, 113, 133, 0.45);
    }

    .eval-badge.empty {
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed var(--border-light);
      color: var(--text-dim);
    }

    .eval-desc-box {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-heading);
      flex: 1;
      text-align: center;
      line-height: 1.35;
    }

    .slot-reset-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-body);
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .slot-reset-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-pure);
    }
  </style>
</head>

      <p class="slide-subtitle">將左側材料拖曳或點選置入右側電路中，即時觀察導電（Conducts）與絕緣（Does Not Conduct）的特性！</p>

  <script>
    let currentMat = null; // 預設空插槽，等待使用者拖入測試
    let activeDragAvatar = null;
    let isDragging = false;
    let dragMatKey = null;

    // =========================================================================
    // 100% 實體不透明自訂拖曳跟隨系統 (徹底解決瀏覽器原生半透明殘影問題)
    // =========================================================================
    function initSolidDragSystem() {
      const cards = document.querySelectorAll('.mat-hero-card');
      const stagePanel = document.getElementById('circuitStagePanel');

      cards.forEach(card => {
        card.addEventListener('pointerdown', (e) => {
          // 只處理滑鼠主鍵
          if (e.button !== 0) return;
          const matKey = card.dataset.mat;
          if (!matKey) return;

          let startX = e.clientX;
          let startY = e.clientY;
          let hasMoved = false;

          function onPointerMove(moveEvent) {
            const dx = moveEvent.clientX - startX;
            const dy = moveEvent.clientY - startY;
            if (!hasMoved && Math.hypot(dx, dy) > 8) {
              hasMoved = true;
              isDragging = true;
              dragMatKey = matKey;
              createSolidAvatar(matKey, moveEvent.clientX, moveEvent.clientY);
            }

            if (isDragging && activeDragAvatar) {
              activeDragAvatar.style.left = moveEvent.clientX + 'px';
              activeDragAvatar.style.top = moveEvent.clientY + 'px';

              // 檢查游標是否在測試台插槽範圍
              const slotBox = document.getElementById('slotGuideBox');
              const rect = stagePanel.getBoundingClientRect();
              const isOverStage = (
                moveEvent.clientX >= rect.left &&
                moveEvent.clientX <= rect.right &&
                moveEvent.clientY >= rect.top &&
                moveEvent.clientY <= rect.bottom
              );
              if (slotBox) {
                slotBox.classList.toggle('slot-active-hover', isOverStage);
              }
            }
          }

          function onPointerUp(upEvent) {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('pointercancel', onPointerUp);

            const slotBox = document.getElementById('slotGuideBox');
            if (slotBox) slotBox.classList.remove('slot-active-hover');

            if (isDragging) {
              isDragging = false;
              // 判定釋放點是否在右側電路板
              const rect = stagePanel.getBoundingClientRect();
              const isDroppedOnStage = (
                upEvent.clientX >= rect.left &&
                upEvent.clientX <= rect.right &&
                upEvent.clientY >= rect.top &&
                upEvent.clientY <= rect.bottom
              );

              if (isDroppedOnStage && dragMatKey) {
                selectMat(dragMatKey);
              }
              removeSolidAvatar();
              dragMatKey = null;
            }
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('pointercancel', onPointerUp);
        });
      });
    }

    // 建立 100% 實體不透明的浮動預覽元素 (完整呈現高品質 SVG 向量圖案與大字標題)
    function createSolidAvatar(matKey, x, y) {
      removeSolidAvatar();

      const sourceCard = document.getElementById(`card-${matKey}`);
      const svgFrame = sourceCard ? sourceCard.querySelector('.mat-svg-frame') : null;
      const svgContent = svgFrame ? svgFrame.innerHTML : '';

      const avatar = document.createElement('div');
      avatar.className = 'solid-drag-avatar';
      avatar.style.left = x + 'px';
      avatar.style.top = y + 'px';

      if (matKey === 'conductor') {
        avatar.style.borderColor = 'var(--amber-gold)';
        avatar.innerHTML = `
          <div class="avatar-svg-box" style="border: 1.5px solid rgba(245, 158, 11, 0.5);">
            ${svgContent}
          </div>
          <div style="font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; color: var(--amber-gold); line-height: 1.1; margin-top: 2px;">Conductor</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: #f1f5f9;">導體（銅線）</div>
        `;
      } else {
        avatar.style.borderColor = 'var(--coral-rose)';
        avatar.innerHTML = `
          <div class="avatar-svg-box" style="border: 1.5px solid rgba(251, 113, 133, 0.5);">
            ${svgContent}
          </div>
          <div style="font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; color: var(--coral-rose); line-height: 1.1; margin-top: 2px;">Insulator</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: #f1f5f9;">絕緣體（木材）</div>
        `;
      }

      document.body.appendChild(avatar);
      activeDragAvatar = avatar;
    }

    function removeSolidAvatar() {
      if (activeDragAvatar && activeDragAvatar.parentNode) {
        activeDragAvatar.parentNode.removeChild(activeDragAvatar);
      }
      activeDragAvatar = null;
    }

    // =========================================================================
    // 材料切換與電路動態渲染 (100% 實體圖案)
    // =========================================================================
    function selectMat(matKey) {
      currentMat = matKey;
      renderLabUI();
    }

    function handleSlotCycle() {
      if (!currentMat) selectMat('conductor');
      else if (currentMat === 'conductor') selectMat('insulator');
      else selectMat(null);
    }

    function renderLabUI() {
      // 1. 左側卡片反白與按鈕標記
      ['conductor', 'insulator'].forEach(m => {
        const card = document.getElementById(`card-${m}`);
        const btn = document.getElementById(`btn-quick-${m}`);
        if (card) card.classList.toggle('selected', currentMat === m);
        if (btn) btn.classList.toggle('active', currentMat === m);
      });
      const emptyBtn = document.getElementById('btn-quick-empty');
      if (emptyBtn) emptyBtn.classList.toggle('active', currentMat === null);

      // 2. 電路畫布動態渲染
      const stream = document.getElementById('electronStream');
      const bulbAura = document.getElementById('bulbAura');
      const bulbAuraOuter = document.getElementById('bulbAuraOuter');
      const bulbGlassFill = document.getElementById('bulbGlassFill');
      const bulbFilamentGlow = document.getElementById('bulbFilamentGlow');
      const filamentWire = document.getElementById('filamentWire');
      const bulbText = document.getElementById('bulbText');
      const slotBox = document.getElementById('slotGuideBox');
      const slotContent = document.getElementById('slotContentVisual');
      const centerHud = document.getElementById('circuitCenterHud');
      const evalBadge = document.getElementById('evalBadge');
      const evalIcon = document.getElementById('evalIcon');
      const evalTitle = document.getElementById('evalTitle');
      const evalDesc = document.getElementById('evalDesc');

      if (!slotContent) return;

      if (!currentMat) {
        // ------------------ 空插槽 (開路斷電) ------------------
        slotBox.style.display = 'block';
        slotBox.setAttribute('stroke', 'rgba(255,255,255,0.35)');
        slotBox.setAttribute('stroke-dasharray', '8 8');
        slotBox.setAttribute('fill', 'rgba(255,255,255,0.03)');

        slotContent.innerHTML = `
          <text x="360" y="67" fill="var(--cyan-core)" font-size="17" font-weight="900" text-anchor="middle">
            📥 請拖曳或點選左側材料置入此處
          </text>
          <text x="360" y="89" fill="var(--text-dim)" font-size="13" font-weight="700" text-anchor="middle">
            (Drag Conductor or Insulator Here)
          </text>
        `;

        if (centerHud) {
          centerHud.innerHTML = `
            <!-- 預設等待卡片 (置於電路正中央) -->
            <rect x="-200" y="-45" width="400" height="90" rx="20" fill="var(--bg-card)" stroke="var(--cyan-core)" stroke-width="2" stroke-dasharray="8 6" />
            <text x="0" y="-6" fill="var(--cyan-core)" font-size="21" font-weight="900" text-anchor="middle">
              📥 請拖曳材料置入上方測試插槽
            </text>
            <text x="0" y="24" fill="var(--text-body)" font-size="14" font-weight="800" text-anchor="middle">
              Drag Conductor or Insulator to Test
            </text>
          `;
        }

        stream.style.display = 'none';

        bulbAura.className.baseVal = 'bulb-glow-off';
        if (bulbAuraOuter) bulbAuraOuter.setAttribute('opacity', '0');
        if (bulbFilamentGlow) bulbFilamentGlow.style.display = 'none';
        if (filamentWire) {
          filamentWire.setAttribute('stroke', '#64748b');
          filamentWire.setAttribute('stroke-width', '2.5');
        }
        if (bulbGlassFill) bulbGlassFill.setAttribute('fill', 'rgba(255,255,255,0.08)');
        bulbText.textContent = 'OFF';
        bulbText.setAttribute('fill', '#94a3b8');
        if (evalBadge) {
          evalBadge.className = 'eval-badge empty';
          if (evalIcon) evalIcon.textContent = '⚪';
          if (evalTitle) evalTitle.textContent = 'Circuit Open (等待置入材料)';

    function toggleTheme() {
      const curr = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', curr === 'dark' ? 'light' : 'dark');
    }

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === '1') selectMat('conductor');
      else if (k === '2') selectMat('insulator');
      else if (k === 'r') selectMat(null);
      else if (k === 't') toggleTheme();
    });

    // 初始化自訂實體拖曳，預設空插槽給使用者拖入
    window.addEventListener('DOMContentLoaded', () => {
      initSolidDragSystem();
      selectMat(null);
    });
    // 保險觸發
    initSolidDragSystem();
    selectMat(null);
  </script>

  

  <!-- 4 大主題切換與播放器父子通訊橋接 -->
  <script>
    (function() {
      const THEMES = ['cyber', 'clean', 'maker', 'titanium'];
      function applyTheme(theme) {
        if (!theme) theme = 'cyber';
        document.documentElement.setAttribute('data-theme', theme);
      }
      try {
        const savedTheme = localStorage.getItem('slides_theme') || 'cyber';
        applyTheme(savedTheme);
      } catch(e) {}

      function cycleLocalTheme() {
        const curr = document.documentElement.getAttribute('data-theme') || 'cyber';
        let idx = THEMES.indexOf(curr);
        if (idx === -1) idx = 0;
        const next = THEMES[(idx + 1) % THEMES.length];
        applyTheme(next);
        try { localStorage.setItem('slides_theme', next); } catch(e) {}
      }

      window.addEventListener('keydown', function(e) {
        if (window.parent && window.parent !== window) {
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'next' }, '*');
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'prev' }, '*');
          } else if (e.key === 't' || e.key === 'T') {
            window.parent.postMessage({ type: 'SLIDE_NAV', action: 'theme' }, '*');
          }
        } else {
          // 獨立開啟時按 T 也能切換 4 種風格
          if (e.key === 't' || e.key === 'T') {
            cycleLocalTheme();
          }
        }
      });
    })();
  </script>
